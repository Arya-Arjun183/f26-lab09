[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "campusreserve-analytics"
version = "1.0.0"
description = "Reports built from the CampusReserve event log."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
campusreserve-analytics = "campusreserve_analytics.cli:main"

[tool.setuptools]
packages = ["campusreserve_analytics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
