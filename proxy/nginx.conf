events {}

http {
  # Docker's DNS. Looking api up again every few seconds means copies added
  # with --scale get traffic without restarting the proxy.
  resolver 127.0.0.11 valid=5s ipv6=off;

  server {
    listen 80;

    location / {
      set $api http://api:8080;
      proxy_pass $api;
      # Which copy answered.
      add_header X-Upstream $upstream_addr always;
    }
  }
}
